[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchguardian"
version = "0.1.0"
description = "Permission-bound LaunchGuardian CLI skeleton for validating LGF project files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
launchguardian = "launchguardian.cli:main"

[tool.setuptools.packages.find]
include = ["launchguardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
