[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchguardian"
version = "0.2.0"
description = "Local, defensive, permission-bound security scanner and launch-readiness validator for the LaunchGuardian Framework (LGF). Part of the Drydock SDD+ toolchain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Paez" }]
keywords = ["security", "scanner", "launch-readiness", "sdd", "drydock", "vibe-coding", "gitleaks", "semgrep", "trivy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]
dependencies = [
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/danizeap/launchguardian-cli"
Issues = "https://github.com/danizeap/launchguardian-cli/issues"
Changelog = "https://github.com/danizeap/launchguardian-cli/blob/main/CHANGELOG.md"
Drydock = "https://github.com/danizeap/drydock"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
launchguardian = "launchguardian.cli:main"

[tool.setuptools.packages.find]
include = ["launchguardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
