name: LaunchGuardian non-strict

on:
  pull_request:
  workflow_dispatch:

jobs:
  launchguardian:
    name: LaunchGuardian non-strict scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install LaunchGuardian
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Future package usage:
          # python -m pip install launchguardian
          #
          # Until LaunchGuardian is published, install from the implementation repo.
          # Replace the URL/ref with your pinned fork, branch, tag, or commit.
          python -m pip install "git+https://github.com/danizeap/launchguardian-cli.git@main"
          #
          # If this workflow runs inside the launchguardian-cli repo itself, use:
          # python -m pip install -e .

      - name: Optionally install external scanners
        shell: bash
        run: |
          # This non-strict workflow is for early adoption only.
          # Missing external scanners will be reported as INCOMPLETE rather than
          # blocking the workflow by strict scanner policy.
          echo "Install Gitleaks, Semgrep, and Trivy here when ready."

      - name: Run LaunchGuardian non-strict scan
        shell: bash
        run: launchguardian scan --target .

      - name: Upload LaunchGuardian reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launchguardian-reports
          path: reports/launchguardian
          if-no-files-found: warn
