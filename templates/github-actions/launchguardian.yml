name: LaunchGuardian

on:
  pull_request:
  workflow_dispatch:

jobs:
  launchguardian:
    name: LaunchGuardian strict scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install LaunchGuardian
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Future package usage:
          # python -m pip install launchguardian
          #
          # Until LaunchGuardian is published, install from the implementation repo.
          # Replace the URL/ref with your pinned fork, branch, tag, or commit.
          python -m pip install "git+https://github.com/danizeap/launchguardian-cli.git@main"
          #
          # If this workflow runs inside the launchguardian-cli repo itself, use:
          # python -m pip install -e .

      - name: Optionally install external scanners
        shell: bash
        run: |
          # Strict scanner mode blocks when expected external scanners are missing.
          # Pin scanner versions using your organization's approved install method.
          #
          # Semgrep can be installed with pip:
          # python -m pip install semgrep
          #
          # Gitleaks and Trivy should be installed from pinned release binaries,
          # package-manager packages, or approved setup actions before relying on
          # this strict workflow as a release gate.
          echo "External scanner installation is intentionally project-controlled."

      - name: Run LaunchGuardian strict scan
        shell: bash
        run: launchguardian scan --target . --strict-scanners

      - name: Upload LaunchGuardian reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launchguardian-reports
          path: reports/launchguardian
          if-no-files-found: warn
