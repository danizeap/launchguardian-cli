name: LaunchGuardian

on:
  pull_request:
  workflow_dispatch:

jobs:
  launchguardian:
    name: Framework-mode scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run LaunchGuardian framework-mode scan
        run: python -m launchguardian.cli scan --target . --framework-mode

      - name: Upload LaunchGuardian reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchguardian-reports
          path: reports/launchguardian
          if-no-files-found: warn
