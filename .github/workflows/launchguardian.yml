name: LaunchGuardian

on:
  pull_request:
  workflow_dispatch:

jobs:
  launchguardian:
    name: Framework-mode scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run LaunchGuardian framework-mode scan
        run: python -m launchguardian.cli scan --target . --framework-mode

      - name: Upload LaunchGuardian reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launchguardian-reports
          path: reports/launchguardian
          if-no-files-found: warn
