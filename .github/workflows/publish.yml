name: Publish to PyPI

# Trusted publishing (OIDC): no API tokens stored anywhere.
# One-time setup on pypi.org -> your project -> Publishing -> Add a new publisher:
#   Owner: danizeap | Repository: launchguardian-cli
#   Workflow: publish.yml | Environment: pypi
# Then publishing = creating a GitHub release (tag e.g. v0.1.1).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Dogfood scan (framework mode)
        run: python -m launchguardian.cli scan --target . --framework-mode --skip-lgf-validation
      - name: Build distributions
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
