name: Publish to PyPI

# Trusted publishing (OIDC): no API tokens stored anywhere.
# One-time setup on pypi.org -> your project -> Publishing -> Add a new publisher:
#   Owner: danizeap | Repository: launchguardian-cli
#   Workflow: publish.yml | Environment: pypi
# Then publishing = creating a GitHub release (tag e.g. v0.1.1).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Dogfood scan (framework mode)
        run: python -m launchguardian.cli scan --target . --framework-mode --skip-lgf-validation
      - name: Build distributions
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
